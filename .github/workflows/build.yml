name: Build SSS X Android APK

on:
  push:
    branches:
      - main
      - master
      - devel
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - devel
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SSS X APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Restore Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSS-X-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: SSS X ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
