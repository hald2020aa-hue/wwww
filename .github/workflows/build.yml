name: Build SSS X Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SSS X APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant SDK Permissions & Accept Licenses
        run: |
          echo "Granting runner write permissions to Android SDK directory..."
          sudo chown -R $USER:$GROUP /usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          printf "859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          printf "e9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -n 1)
          echo "Using sdkmanager from: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "Installing platforms;android-36 from Canary channel..."
            echo "y" | "$SDKMANAGER" --channel=3 "platforms;android-36" || true
            echo "y" | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Ensure Valid Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d -i debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
            echo "Generating fallback debug keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Validating keystore..."
          keytool -list -keystore debug.keystore -storepass android

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "==================== BUILD ERROR SUMMARY ===================="
            grep -A 25 "\* What went wrong:" build.log || tail -n 60 build.log
            exit 1
          }

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          echo "Locating generated APK files..."
          find . -name "*.apk" -type f
          APK_FILE=$(find app/build/outputs -name "*.apk" -type f | grep -i "debug" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | grep -i "debug" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp -v "$APK_FILE" build_output/SSS-X-Debug.apk
            ls -lh build_output/SSS-X-Debug.apk
          else
            echo "ERROR: No APK file was found after assembleDebug!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSS-X-Debug-APK
          path: build_output/SSS-X-Debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/SSS-X-Debug.apk
          name: SSS X ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
