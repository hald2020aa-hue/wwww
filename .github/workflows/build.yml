name: Build SSS X Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SSS X APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Clean Legacy Sources
        run: |
          echo "Cleaning all legacy, debug, test, and non-whitelisted source trees..."
          rm -rf app/src/debug app/src/release app/src/androidTest app/src/test app/src/main/kotlin_new app/src/main/java
          if [ -d "app/src/main/kotlin/org/koitharu/kotatsu" ]; then
            for item in app/src/main/kotlin/org/koitharu/kotatsu/*; do
              base=$(basename "$item")
              if [ "$base" != "data" ] && [ "$base" != "ui" ] && [ "$base" != "MainActivity.kt" ]; then
                echo "Removing legacy file/directory: $item"
                rm -rf "$item"
              fi
            done
          fi
          echo "Verifying model and repository files..."
          mkdir -p app/src/main/kotlin/org/koitharu/kotatsu/data/model
          if [ ! -f "app/src/main/kotlin/org/koitharu/kotatsu/data/model/Manga.kt" ]; then
            echo "" | base64 -d > app/src/main/kotlin/org/koitharu/kotatsu/data/model/Manga.kt
          fi
          ls -la app/src/main/kotlin/org/koitharu/kotatsu/data/model
          ls -la app/src/main/kotlin/org/koitharu/kotatsu/data/repository

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant SDK Permissions & Accept Licenses
        run: |
          echo "Granting runner write permissions to Android SDK directory..."
          sudo chown -R $USER:$GROUP /usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          printf "859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          printf "e9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -n 1)
          echo "Using sdkmanager from: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "Installing platforms;android-36 and build-tools;36.0.0 from Canary channel..."
            echo "y" | "$SDKMANAGER" --channel=3 "platforms;android-36" "build-tools;36.0.0" || true
            echo "y" | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Ensure Valid Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d -i debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
            echo "Generating fallback debug keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Validating keystore..."
          keytool -list -keystore debug.keystore -storepass android
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew clean :app:assembleDebug --no-daemon --no-build-cache --rerun-tasks --stacktrace 2>&1 | tee build.log || {
            echo "=========================================================="
            echo "============= FIRST 50 COMPILER ERRORS ==================="
            echo "=========================================================="
            grep -n -E "(e: |error:|FAILED|Exception)" build.log | head -n 50 || true
            echo "=========================================================="
            echo "============= LAST 100 LINES OF BUILD LOG ================"
            echo "=========================================================="
            tail -n 100 build.log
            echo "=========================================================="
            exit 1
          }

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          echo "Locating generated APK files..."
          find . -name "*.apk" -type f
          APK_FILE=$(find app/build/outputs -name "*debug*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*debug*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp -v "$APK_FILE" build_output/SSS-X-Debug.apk
            ls -lh build_output/SSS-X-Debug.apk
          else
            echo "ERROR: No APK file was found after assembleDebug!"
            echo "--- Last 100 lines of build.log ---"
            tail -n 100 build.log 2>/dev/null || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSS-X-Debug-APK
          path: build_output/SSS-X-Debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: build_output/SSS-X-Debug.apk
          name: SSS X v1.0.${{ github.run_number }}
          body: "Automated build of SSS X Android APK (Run #${{ github.run_number }})"
          draft: false
          prerelease: false
          generate_release_notes: true
